services:
  - type: web
    name: pdf-support-bot
    runtime: docker
    plan: free
    healthCheckPath: /readyz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.8-live
      - key: GEMINI_VOICE
        value: Kore
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDINGS_PATH
        value: data/embeddings.npz
      - key: ALLOWED_ORIGINS
        value: https://cg-hr-bot.vercel.app
      - key: REQUEST_TIMEOUT_SECONDS
        value: '45'
      - key: VOICE_SESSION_SECONDS
        value: '300'
      - key: MAX_VOICE_SESSIONS
        value: '8'
